<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">飞书数据平台闭环架构图</title>
  <desc id="desc">来源经过摄入、治理后进入运营视图；生产只读 Schema 检查与正式写入边界分开。</desc>
  <rect width="1200" height="640" fill="#F2EEE4"/>
  <text x="72" y="82" fill="#1C1820" font-size="34" font-family="sans-serif" font-weight="700">Data platform · controlled evidence loop</text>
  <text x="72" y="122" fill="#4F4054" font-size="20" font-family="sans-serif">来源不是业务事实；通过治理门后才进入运营视图</text>
  <g font-family="sans-serif">
    <g transform="translate(72 210)">
      <rect width="220" height="150" rx="24" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3"/>
      <text x="28" y="58" fill="#4F4054" font-size="18" font-weight="700">01 · SOURCES</text>
      <text x="28" y="98" fill="#1C1820" font-size="24" font-weight="700">截图 / 文本 / 表单</text>
      <text x="28" y="128" fill="#718C7B" font-size="16">保留来源上下文</text>
    </g>
    <path d="M310 285 H390" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(408 210)">
      <rect width="220" height="150" rx="24" fill="#E7DDE9" stroke="#B9A7C1" stroke-width="3"/>
      <text x="28" y="58" fill="#4F4054" font-size="18" font-weight="700">02 · INGEST</text>
      <text x="28" y="98" fill="#1C1820" font-size="24" font-weight="700">候选数据</text>
      <text x="28" y="128" fill="#4F4054" font-size="16">识别结果待确认</text>
    </g>
    <path d="M646 285 H726" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(744 210)">
      <rect width="220" height="150" rx="24" fill="#DFE7DE" stroke="#718C7B" stroke-width="3"/>
      <text x="28" y="58" fill="#4F4054" font-size="18" font-weight="700">03 · GOVERN</text>
      <text x="28" y="98" fill="#1C1820" font-size="24" font-weight="700">SOP Gate</text>
      <text x="28" y="128" fill="#718C7B" font-size="16">幂等 · 审计 · 清理</text>
    </g>
    <path d="M982 285 H1062" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(978 410)">
      <rect width="150" height="96" rx="20" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3"/>
      <text x="22" y="42" fill="#4F4054" font-size="16" font-weight="700">OPS VIEWS</text>
      <text x="22" y="70" fill="#1C1820" font-size="18">角色化运营视图</text>
    </g>
    <path d="M1078 360 V392" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(72 438)">
      <rect width="760" height="116" rx="24" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3" stroke-dasharray="10 8"/>
      <text x="28" y="43" fill="#4F4054" font-size="18" font-weight="700">PRODUCTION BOUNDARY</text>
      <text x="28" y="78" fill="#1C1820" font-size="22" font-weight="700">Schema 只读检查已完成表级匹配</text>
      <text x="28" y="103" fill="#718C7B" font-size="17">字段级差异与正式写入仍保持 fail-closed</text>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4F4054"/></marker></defs>
</svg>
