<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Service Agent 风险优先工作流图</title>
  <desc id="desc">输入经过风险分类、查询解析、检索和支持度检查，最终进入有证据回答或人工接管。</desc>
  <rect width="1200" height="640" fill="#F2EEE4"/>
  <text x="72" y="82" fill="#1C1820" font-size="34" font-family="sans-serif" font-weight="700">Service Agent · risk-first workflow</text>
  <text x="72" y="122" fill="#4F4054" font-size="20" font-family="sans-serif">模型建议不能覆盖确定性硬风险与人工确认 Gate</text>
  <g font-family="sans-serif">
    <g transform="translate(72 210)"><rect width="170" height="120" rx="22" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3"/><text x="24" y="48" fill="#4F4054" font-size="16" font-weight="700">INPUT</text><text x="24" y="83" fill="#1C1820" font-size="22" font-weight="700">用户问题</text></g>
    <path d="M258 270 H326" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(344 190)"><rect width="190" height="160" rx="22" fill="#E7DDE9" stroke="#B9A7C1" stroke-width="3"/><text x="24" y="48" fill="#4F4054" font-size="16" font-weight="700">RISK</text><text x="24" y="84" fill="#1C1820" font-size="22" font-weight="700">风险分类</text><text x="24" y="116" fill="#4F4054" font-size="16">硬风险优先</text><text x="24" y="142" fill="#4F4054" font-size="16">R0–R3</text></g>
    <path d="M550 270 H618" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(636 190)"><rect width="190" height="160" rx="22" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3"/><text x="24" y="48" fill="#4F4054" font-size="16" font-weight="700">RESOLVE</text><text x="24" y="84" fill="#1C1820" font-size="22" font-weight="700">查询解析</text><text x="24" y="116" fill="#718C7B" font-size="16">多轮改写</text><text x="24" y="142" fill="#718C7B" font-size="16">原始查询留痕</text></g>
    <path d="M842 270 H910" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(928 190)"><rect width="200" height="160" rx="22" fill="#DFE7DE" stroke="#718C7B" stroke-width="3"/><text x="24" y="48" fill="#4F4054" font-size="16" font-weight="700">RETRIEVE</text><text x="24" y="84" fill="#1C1820" font-size="22" font-weight="700">证据检索</text><text x="24" y="116" fill="#718C7B" font-size="16">多查询聚合</text><text x="24" y="142" fill="#718C7B" font-size="16">来源去重</text></g>
    <path d="M1028 366 V420" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(666 438)"><rect width="462" height="120" rx="24" fill="#FBF8F1" stroke="#D4CCC1" stroke-width="3"/><text x="28" y="43" fill="#4F4054" font-size="16" font-weight="700">DUAL SUPPORT GATE</text><text x="28" y="78" fill="#1C1820" font-size="22" font-weight="700">检索证据充分性 + 上下文支持</text><text x="28" y="104" fill="#718C7B" font-size="16">满足 → 有来源回答</text></g>
    <path d="M650 498 H566" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(72 420)"><rect width="472" height="156" rx="24" fill="#E7DDE9" stroke="#B9A7C1" stroke-width="3"/><text x="28" y="46" fill="#4F4054" font-size="16" font-weight="700">FAIL-CLOSED</text><text x="28" y="84" fill="#1C1820" font-size="25" font-weight="700">人工接管</text><text x="28" y="116" fill="#4F4054" font-size="17">硬风险 · 证据不足 · 未支持问题</text><text x="28" y="142" fill="#4F4054" font-size="17">记录知识缺口，不猜测答案</text></g>
    <path d="M438 350 V402" stroke="#4F4054" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4F4054"/></marker></defs>
</svg>
